<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng điều khiển | Bảo tàng Số</title>
  <link rel="stylesheet" href="../css/base/reset.css">
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/typography.css">
  <link rel="stylesheet" href="../css/components/navbar.css">
  <link rel="stylesheet" href="../css/components/sidebar.css">
  <link rel="stylesheet" href="../css/components/button.css">
  <link rel="stylesheet" href="../css/components/modal.css">
  <link rel="stylesheet" href="../css/components/card.css">
  <link rel="stylesheet" href="../css/layouts/main-layout.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="layout__main">
      <header id="navbar"></header>
      <main class="layout__content">
        <div class="page-header"><div><h1>Xin chào, <span id="userName"></span></h1><p class="text-muted" id="todayText"></p></div>
          <div class="toolbar"><a class="btn btn--primary" href="checkin.html">📷 Soát vé</a><a class="btn btn--outline" href="tickets.html?new=1">+ Bán vé tại quầy</a></div></div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="grid-2">
          <section class="card"><div class="card__header"><h3>Lượt vào gần đây</h3><a class="text-small" href="checkin.html">Xem tất cả</a></div>
            <div class="table-wrap"><table class="table"><thead><tr><th>Thời gian</th><th>Mã vé</th><th>Cổng</th><th>Kết quả</th></tr></thead><tbody id="recentCheckins"></tbody></table></div></section>
          <section class="card"><div class="card__header"><h3>Sự kiện sắp tới</h3><a class="text-small" href="events.html">Quản lý</a></div><div id="upcomingEvents"></div></section>
        </div>
        <section class="card"><div class="card__header"><h3>Đoàn khách chờ duyệt</h3><a class="text-small" href="visitors.html">Quản lý</a></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Đoàn</th><th>Số người</th><th>Ngày</th><th>Trưởng đoàn</th></tr></thead><tbody id="pendingGroups"></tbody></table></div></section>
      </main>
    </div>
  </div>
  <script src="../js/config/api.config.js"></script>
  <script src="../js/config/app.config.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/validation.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/services/api.service.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/ticket.service.js"></script>
  <script src="../js/services/event.service.js"></script>
  <script src="../js/services/visitor.service.js"></script>
  <script src="../js/services/survey.service.js"></script>
  <script src="../js/services/statistics.service.js"></script>
  <script src="../js/components/notification.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
