<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Loại vé & Giá | Quản trị Bảo Tàng Di Sản</title>

  <!-- Font chữ & bộ icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />

  <!-- Base -->
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/typography.css" />
  <link rel="stylesheet" href="../css/base/design-tokens.css" />
  <link rel="stylesheet" href="../css/base/utilities.css" />
  <!-- Layout: khung quản trị (menu trái + thanh trên) -->
  <link rel="stylesheet" href="../css/layouts/admin-layout.css" />
  <!-- Components -->
  <link rel="stylesheet" href="../css/components/modal.css" />
  <link rel="stylesheet" href="../css/components/heritage-ui.css" />
  <!-- Page -->
  <link rel="stylesheet" href="../css/pages/ticket-types.css" />
</head>

<body class="theme-heritage adm-body">
  <div class="adm-shell">
    <!-- Menu trái: js/components/admin-shell.js (danh sách mục ở APP_CONFIG.ADMIN_MENU) -->
    <aside class="adm-sidebar" id="adminSidebar"></aside>
    <div class="adm-main">
      <header class="adm-topbar" id="adminTopbar"></header>
      <main class="adm-content">
        <section class="adm-head">
          <div>
            <span class="adm-eyebrow"><span class="material-symbols-outlined">sell</span> Bán vé & phát hành</span>
            <h1 class="adm-title">Loại vé & Giá vé</h1>
            <p class="adm-desc">Các loại vé khách chọn được khi đặt vé trực tuyến và khi mua tại quầy. Ngừng bán thì loại vé không còn hiện cho khách, vé đã bán vẫn giữ nguyên.</p>
          </div>
          <div class="adm-actions"><button class="hh-btn hh-btn--primary" id="addBtn" type="button"><span class="material-symbols-outlined">add_circle</span> Thêm loại vé</button></div>
        </section>

        <section class="adm-stats" id="stats"></section>

        <section class="adm-card">
          <div class="adm-table-wrap">
            <table class="adm-table">
              <thead><tr><th>Loại vé</th><th>Đối tượng / điều kiện</th><th class="num">Giá vé</th><th class="num">Đã bán</th><th>Trạng thái</th><th class="num">Thao tác</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- ===================== SCRIPTS (thứ tự: config → utils → services → components → pages) ===================== -->
  <script src="../js/config/api.config.js"></script>
  <script src="../js/config/app.config.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/validation.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/admin-ui.js"></script>
  <script src="../js/services/api.service.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/ticket.service.js"></script>
  <script src="../js/components/notification.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/admin-shell.js"></script>
  <script src="../js/pages/ticket-types.js"></script>
</body>
</html>
